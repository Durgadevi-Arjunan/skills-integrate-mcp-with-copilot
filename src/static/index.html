<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/html5-qrcode"></script>
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>

      <section id="ticket-container" class="hidden">
        <h3>Your Ticket</h3>
        <div id="ticket-details">
          <!-- Ticket will be displayed here -->
        </div>
      </section>

      <section id="checkin-container" class="hidden">
        <h3>Check In (Scanner)</h3>
        <div id="scanner-container">
          <div id="qr-scanner" style="width: 100%; height: 300px; border: 1px solid #ccc; margin-bottom: 15px;"></div>
          <p id="scanner-status" style="text-align: center; color: #666;">Initializing scanner...</p>
          <button id="scanner-toggle-btn" class="secondary-btn" type="button">Stop Scanner</button>
        </div>
        <div id="checkin-result" class="hidden"></div>
      </section>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
